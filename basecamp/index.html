        background: #faf7f2;

      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1);
        }

        }
        100% {
          transform: scale(1);
        }
      }

        animation: pop 0.3s ease-out;
      }
      @keyframes flagWave {
        0%,
        100% {

        50% {

        0%,

        top: -10px;

      // ============================================================================
      // UTILITIES — weeklogica op basis van absolute weekindex (jaarwissel-proof)
      // ============================================================================

      const MONDAY_EPOCH = new Date(2024, 0, 1); // maandag 1 jan 2024

      const mondayOf = (d) => {
        const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
        return m;
      };

      const getAbsWeek = (d) =>
        Math.round((mondayOf(d) - MONDAY_EPOCH) / (7 * MS_PER_DAY));

      const dateOfAbsWeek = (absWeek) => {
        const d = new Date(MONDAY_EPOCH);
        d.setDate(d.getDate() + absWeek * 7);
        return d;
      };

      const getISOWeek = (date) => {
        const target = new Date(date.valueOf());
        const dayNr = (date.getDay() + 6) % 7;
        target.setDate(target.getDate() - dayNr + 3);
        const jan4 = new Date(target.getFullYear(), 0, 4);
        const dayDiff = (target - jan4) / MS_PER_DAY;
        return 1 + Math.ceil(dayDiff / 7);
      };

      const weekRangeLabel = (absWeek) => {
        const mon = dateOfAbsWeek(absWeek);
        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        return `${mon.getDate()}/${mon.getMonth() + 1} – ${sun.getDate()}/${
          sun.getMonth() + 1
        }`;
      };

      const formatTimestamp = (ts) => {
        const date = new Date(ts);
        const diff = Date.now() - ts;
        const mins = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / MS_PER_DAY);
        if (mins < 1) return "zojuist";
        if (mins < 60) return `${mins} min geleden`;
        if (hours < 24) return `${hours} uur geleden`;
        if (days < 7) return `${days} dag${days !== 1 ? "en" : ""} geleden`;
        return date.toLocaleDateString("nl-NL", {
          day: "numeric",
          month: "short",
        });
      };

      const slugify = (s) =>
        s
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "") || "route";

      const toast = (msg) => {

      // ============================================================================

      // ============================================================================

      const Icons = {

      // ============================================================================

      const ConfirmDialog = ({

      // ============================================================================
      // BERG MET ROUTE — voortgang van de week
      // ============================================================================

      const ROUTE_PTS = [
        [36, 205],
        [92, 176],
        [70, 146],
        [124, 120],
        [98, 90],
        [142, 64],
        [120, 28],
      ];

      const pathPointAt = (pts, t) => {
        if (t <= 0) return { x: pts[0][0], y: pts[0][1] };
        if (t >= 1)
          return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
        const segs = [];
        let total = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const len = Math.hypot(
            pts[i + 1][0] - pts[i][0],
            pts[i + 1][1] - pts[i][1]
          );
          segs.push(len);
          total += len;
        }
        let dist = t * total;
        for (let i = 0; i < segs.length; i++) {
          if (dist <= segs[i]) {
            const f = segs[i] ? dist / segs[i] : 0;
            return {
              x: pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
              y: pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f,
            };
          }
          dist -= segs[i];
        }
        return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
      };

      function MountainProgress({ progress, summited }) {
        // klimmer blijft nét onder de top tot alles klaar is; vlag markeert de send
        const p = pathPointAt(ROUTE_PTS, Math.min(progress, 0.97));
        return (

            {/* krijtlijn-route */}

              strokeDasharray="1 9"
              strokeLinecap="round"
              opacity="0.9"

            {/* tussenpunten */}
            {ROUTE_PTS.map((pt, i) => {

            </g>

        );

      // ============================================================================
      // ONBOARDING — eenmalig de twee klimmers instellen
      // ============================================================================

      function Onboarding({ onSave }) {
        const [name1, setName1] = useState("");
        const [name2, setName2] = useState("");
        const [saving, setSaving] = useState(false);

        const valid =
          name1.trim() &&
          name2.trim() &&
          name1.trim().toLowerCase() !== name2.trim().toLowerCase();

        const save = async () => {
          if (!valid || saving) return;
          setSaving(true);
          try {
            await onSave([name1.trim(), name2.trim()]);

            toast("Opslaan mislukt, probeer opnieuw");
            setSaving(false);

        return (

              <button
                onClick={save}

                className={`w-full mt-6 p-4 rounded-xl font-bold text-white transition-all ${
                  valid && !saving
                    ? "hover:opacity-90 active:scale-95"
                    : "opacity-40 cursor-not-allowed"

                style={{ background: SAGE }}

      }

      // ============================================================================
      // USER PICKER
      // ============================================================================

      function UserPicker({ people, onSelect }) {

              {!isStandalone && (

                  className="w-full text-white p-4 rounded-xl shadow-lg transition-all hover:opacity-90 flex items-center justify-center gap-2 font-semibold"
                  style={{ background: TERRA }}
                >
                  <span className="text-xl">📱</span>
                  Zet 'm op je beginscherm
                </button>
              )}

              {showInstallGuide && (
                <React.Fragment>
                  <div
                    className="fixed inset-0 bg-black bg-opacity-40 z-40"
                    onClick={() => setShowInstallGuide(false)}
                  />
                  <div className="fixed inset-0 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full max-h-[90vh] overflow-y-auto animate-fadeIn">
                      <div className="flex justify-between items-start mb-4">
                        <h2 className="text-xl font-bold" style={{ color: INK }}>
                          Installeer op beginscherm
                        </h2>
                        <button
                          onClick={() => setShowInstallGuide(false)}
                          className="p-1 hover:bg-gray-100 rounded-lg"
                        >
                          <Icons.X size={20} />
                        </button>
                      </div>
                      <div className="space-y-4">
                        <div className="bg-[#EEF1E6] border-l-4 p-4 rounded" style={{ borderColor: SAGE }}>
                          <p className="text-sm font-bold mb-1" style={{ color: INK }}>
                            iPhone (Safari):
                          </p>
                          <ol className="text-sm text-gray-600 space-y-1 list-decimal list-inside">
                            <li>Tik op het <strong>deel-icoontje</strong> onderaan</li>
                            <li>Kies <strong>"Zet op beginscherm"</strong></li>
                            <li>Tik op <strong>"Voeg toe"</strong></li>
                          </ol>
                        </div>
                        <div className="bg-[#F4E3DC] border-l-4 p-4 rounded" style={{ borderColor: TERRA }}>
                          <p className="text-sm font-bold mb-1" style={{ color: INK }}>
                            Android (Chrome):
                          </p>
                          <ol className="text-sm text-gray-600 space-y-1 list-decimal list-inside">
                            <li>Tik op de <strong>drie puntjes</strong> rechtsboven</li>
                            <li>Kies <strong>"Toevoegen aan startscherm"</strong></li>
                            <li>Tik op <strong>"Toevoegen"</strong></li>
                          </ol>
                        </div>
                        <button
                          onClick={() => setShowInstallGuide(false)}
                          className="w-full bg-gray-100 hover:bg-gray-200 p-3 rounded-xl font-semibold"
                          style={{ color: INK }}
                        >
                          Begrepen
                        </button>
                      </div>
                    </div>
                  </div>
                </React.Fragment>
              )}
            </div>
          </div>
        );
      }

      // ============================================================================
      // MAIN APP
      // ============================================================================

      function App() {
        const [user, setUser] = useState(
          localStorage.getItem(USER_KEY) || ""
        );
        const [view, setView] = useState("wand");

        const [config, setConfig] = useState(null);
        const [currentTasks, setCurrentTasks] = useState({});
        const [lastTasks, setLastTasks] = useState({});
        const [activity, setActivity] = useState([]);
        const [streak, setStreak] = useState({ count: 0, lastSummitAbsWeek: null });
        const [boulderLogs, setBoulderLogs] = useState([]);
        const [routeLog, setRouteLog] = useState([]);
        const [loggingBoulder, setLoggingBoulder] = useState(null);
        const [statsPeriod, setStatsPeriod] = useState("week");
        const [loading, setLoading] = useState(true);
        const [showConfetti, setShowConfetti] = useState(false);

        const [now, setNow] = useState(new Date());
        const nowAbsWeek = getAbsWeek(now);

        useEffect(() => {
          const interval = setInterval(() => setNow(new Date()), 60000);
          return () => clearInterval(interval);
        }, []);

        // ------------------------------------------------------------------
        // FIREBASE SYNC
        // ------------------------------------------------------------------

        useEffect(() => {
          const refs = {
            config: dbRef("config"),
            current: dbRef("currentWeekTasks"),
            last: dbRef("lastWeekTasks"),
            activity: dbRef("activity"),
            streak: dbRef("streak"),
            boulderLogs: dbRef("boulderLogs"),
            routeLog: dbRef("routeLog"),
          };

          const loadTimeout = setTimeout(() => {
            console.error("Firebase loading timeout");
            setLoading(false);
          }, 10000);

          refs.config.on(
            "value",
            (snap) => {
              clearTimeout(loadTimeout);
              const data = snap.val();
              if (data) {
                setConfig({
                  setupDone: !!data.setupDone,
                  people: data.people || [],
                  tasks: data.tasks || [],
                  boulders: data.boulders || [],
                  currentAbsWeek:
                    data.currentAbsWeek != null
                      ? data.currentAbsWeek
                      : getAbsWeek(new Date()),
                  lastAbsWeek:
                    data.lastAbsWeek != null ? data.lastAbsWeek : null,
                });
                setLoading(false);
                // bestaande database van vóór de boulders-update? eenmalig seeden
                if (!data.bouldersInit) {
                  dbRef("config").update({
                    boulders: DEFAULT_BOULDERS,
                    bouldersInit: true,
                  });
                }
              } else {
                const defaultConfig = {
                  setupDone: false,
                  people: [],
                  tasks: DEFAULT_TASKS,
                  boulders: DEFAULT_BOULDERS,
                  bouldersInit: true,
                  currentAbsWeek: getAbsWeek(new Date()),
                  lastAbsWeek: null,
                };
                dbRef("config").set(defaultConfig);
                setConfig(defaultConfig);
                setLoading(false);
              }
            },
            (error) => {
              clearTimeout(loadTimeout);
              console.error("Firebase error:", error);
              toast("Kan geen verbinding maken");
              setLoading(false);
            }
          );

          refs.current.on("value", (snap) => setCurrentTasks(snap.val() || {}));
          refs.last.on("value", (snap) => setLastTasks(snap.val() || {}));
          refs.activity.on("value", (snap) => setActivity(snap.val() || []));
          refs.streak.on("value", (snap) =>
            setStreak(snap.val() || { count: 0, lastSummitAbsWeek: null })
          );
          refs.boulderLogs.on("value", (snap) =>
            setBoulderLogs(snap.val() || [])
          );
          refs.routeLog.on("value", (snap) => setRouteLog(snap.val() || []));

          return () => {
            clearTimeout(loadTimeout);
            Object.values(refs).forEach((ref) => ref.off());
          };
        }, []);

        // ------------------------------------------------------------------
        // WEEKOVERGANG (op basis van absolute weekindex, jaarwissel-proof)
        // ------------------------------------------------------------------

        const isTransitioning = useRef(false);

        useEffect(() => {
          if (!config || loading || isTransitioning.current) return;
          if (config.currentAbsWeek < nowAbsWeek) {
            isTransitioning.current = true;
            handleWeekTransition();
          }
        }, [config, nowAbsWeek, loading]);

        const handleWeekTransition = async () => {
          try {
            await dbRef("lastWeekTasks").set(currentTasks);
            await dbRef("currentWeekTasks").set(null);
            await dbRef("config").update({
              currentAbsWeek: nowAbsWeek,
              lastAbsWeek: config.currentAbsWeek,
            });
            await logActivity(
              "systeem",
              "nieuwe week gestart",
              `Week ${getISOWeek(dateOfAbsWeek(nowAbsWeek))}`
            );
          } catch (error) {
            console.error("Week transition error:", error);
            toast("Fout bij weekovergang");
          } finally {
            isTransitioning.current = false;
          }
        };

        // ------------------------------------------------------------------
        // HELPERS
        // ------------------------------------------------------------------

        const getAssignee = (task, absWeek) => {
          const people = (config && config.people) || [];
          if (!people.length) return null;
          if (task.mode === "vast")
            return people.includes(task.owner) ? task.owner : null;
          const offset = task.offset || 0;
          const idx =
            (((absWeek + offset) % people.length) + people.length) %
            people.length;
          return people[idx];
        };

        const logActivity = async (who, action, detail) => {
          const entry = {
            user: who,
            action,
            detail: detail || "",
            at: Date.now(),
            absWeek: config ? config.currentAbsWeek : nowAbsWeek,
          };
          const newActivity = [entry, ...activity].slice(0, ACTIVITY_LIMIT);
          await dbRef("activity").set(newActivity);
        };

        const toggleTask = async (taskId, isLastWeek = false) => {
          const src = isLastWeek ? lastTasks : currentTasks;
          const wasDone = !!src[taskId];
          const newTasks = { ...src };
          if (wasDone) {
            delete newTasks[taskId];
          } else {
            newTasks[taskId] = {
              by: user,
              at: Date.now(),
              ...(isLastWeek ? { late: true } : {}),
            };
          }
          await dbRef(isLastWeek ? "lastWeekTasks" : "currentWeekTasks").set(
            newTasks
          );

          const tasksCfg = (config && config.tasks) || [];
          const task = tasksCfg.find((t) => t.id === taskId);
          const name = task ? task.name : taskId;
          await logActivity(
            user,
            wasDone
              ? "haalde een vinkje weg bij"
              : isLastWeek
              ? "haalde (te laat) in"
              : "stuurde",
            name
          );

          // Persistente send-log voor klimboek & balans
          const entryAbsWeek =
            isLastWeek && config.lastAbsWeek != null
              ? config.lastAbsWeek
              : config.currentAbsWeek;
          if (wasDone) {
            const idx = routeLog.findIndex(
              (l) => l.taskId === taskId && l.absWeek === entryAbsWeek
            );
            if (idx !== -1) {
              const pruned = [...routeLog];
              pruned.splice(idx, 1);
              await dbRef("routeLog").set(pruned);
            }
          } else {
            const entry = {
              taskId,
              name,
              grade: task ? task.grade : "blauw",
              by: user,
              at: Date.now(),
              absWeek: entryAbsWeek,
              late: isLastWeek,
            };
            await dbRef("routeLog").set(
              [entry, ...routeLog].slice(0, ROUTE_LOG_LIMIT)
            );
          }

          // Streak: alleen on-time sends tellen — net als in de klimhal
          if (!isLastWeek && config) {
            const total = tasksCfg.length;
            const doneCount = tasksCfg.filter((t) => newTasks[t.id]).length;
            const allDone = total > 0 && doneCount >= total;
            const curAbs = config.currentAbsWeek;
            const s = streak || { count: 0, lastSummitAbsWeek: null };

            if (allDone && s.lastSummitAbsWeek !== curAbs) {
              const newCount =
                s.lastSummitAbsWeek === curAbs - 1 ? (s.count || 0) + 1 : 1;
              await dbRef("streak").set({
                count: newCount,
                lastSummitAbsWeek: curAbs,
              });
              await logActivity(
                user,
                "bereikte de top! 🏔️",
                `${newCount} ${newCount === 1 ? "week" : "weken"} op rij`
              );
            } else if (!allDone && s.lastSummitAbsWeek === curAbs) {
              const newCount = Math.max(0, (s.count || 0) - 1);
              await dbRef("streak").set({
                count: newCount,
                lastSummitAbsWeek: newCount > 0 ? curAbs - 1 : null,
              });
            }
          }
        };

        const confirmLogBoulder = async () => {
          const b = loggingBoulder;
          if (!b || !config) return;
          const entry = {
            boulderId: b.id,
            by: user,
            at: Date.now(),
            absWeek: config.currentAbsWeek,
          };
          await dbRef("boulderLogs").set(
            [entry, ...boulderLogs].slice(0, BOULDER_LOG_LIMIT)
          );
          await logActivity(user, "deed", `${b.emoji} ${b.name}`);
          setLoggingBoulder(null);
        };

        const undoBoulderLog = async (entry, name) => {
          await dbRef("boulderLogs").set(
            boulderLogs.filter(
              (l) =>
                !(
                  l.boulderId === entry.boulderId &&
                  l.at === entry.at &&
                  l.by === entry.by
                )
            )
          );
          await logActivity(user, "maakte ongedaan:", name);
        };

        // ------------------------------------------------------------------
        // AFGELEIDE STATE
        // ------------------------------------------------------------------

        const tasksCfg = (config && config.tasks) || [];
        const boulders = (config && config.boulders) || [];
        const completedCount = tasksCfg.filter((t) => currentTasks[t.id]).length;
        const totalTasks = tasksCfg.length;
        const progress = totalTasks > 0 ? completedCount / totalTasks : 0;
        const allDone = totalTasks > 0 && completedCount === totalTasks;

        const displayStreak =
          config &&
          streak &&
          streak.lastSummitAbsWeek != null &&
          streak.lastSummitAbsWeek >= config.currentAbsWeek - 1
            ? streak.count || 0
            : 0;

        useEffect(() => {
          if (allDone) {
            setShowConfetti(true);
            const t = setTimeout(() => setShowConfetti(false), 3400);
            return () => clearTimeout(t);
          }
          setShowConfetti(false);
        }, [allDone]);

        // ------------------------------------------------------------------
        // RENDER
        // ------------------------------------------------------------------

        if (loading || !config) {
          return (
            <div
              className="min-h-screen flex items-center justify-center"
              style={{ background: CREAM }}
            >
              <div className="text-center">
                <div className="text-5xl mb-3 floaty">🏔️</div>
                <div className="text-gray-500 font-semibold">Laden...</div>
              </div>
            </div>
          );
        }

        if (!config.setupDone) {
          return (
            <Onboarding
              onSave={async (names) => {
                await dbRef("config").update({
                  people: names,
                  setupDone: true,
                });
              }}
            />
          );
        }

        if (!user) {
          return (
            <UserPicker
              people={config.people}
              onSelect={(name) => {
                setUser(name);
                localStorage.setItem(USER_KEY, name);
              }}
            />
          );
        }

        const isoWeek = getISOWeek(dateOfAbsWeek(config.currentAbsWeek));
        const lastIsoWeek =
          config.lastAbsWeek != null
            ? getISOWeek(dateOfAbsWeek(config.lastAbsWeek))
            : null;
        const lastWeekEditable =
          config.lastAbsWeek != null &&
          nowAbsWeek - config.lastAbsWeek <= 1;
        const lastUndoneCount = tasksCfg.filter((t) => !lastTasks[t.id]).length;

        const sundayLabel = (() => {
          const mon = dateOfAbsWeek(config.currentAbsWeek);
          const sun = new Date(mon);
          sun.setDate(mon.getDate() + 6);
          return sun.toLocaleDateString("nl-NL", {
            day: "numeric",
            month: "long",
          });
        })();

        const timeLeftLabel = (() => {
          const mon = dateOfAbsWeek(config.currentAbsWeek);
          const sun = new Date(mon);
          sun.setDate(mon.getDate() + 6);
          sun.setHours(23, 59, 59, 999);
          const diff = sun - now;
          if (diff <= 0) return "bijna voorbij!";
          const days = Math.floor(diff / MS_PER_DAY);
          const hours = Math.floor((diff % MS_PER_DAY) / 3600000);
          if (days >= 2) return `nog ${days} dagen`;
          if (days === 1) return "nog 1 dag";
          if (hours > 0) return `nog ${hours} uur`;
          return "laatste uurtje!";
        })();

        return (
          <div className="min-h-screen p-4 pb-10" style={{ background: CREAM }}>
            <div className="max-w-md mx-auto">
              {/* HEADER */}
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h1 className="text-2xl font-bold" style={{ color: INK }}>
                    Basecamp
                  </h1>
                  <p className="text-sm text-gray-500">
                    Week {isoWeek} • {weekRangeLabel(config.currentAbsWeek)}
                  </p>
                </div>
                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setView("klimboek")}
                    className={`p-2.5 rounded-xl transition-colors ${
                      view === "klimboek" ? "bg-white shadow-sm" : "hover:bg-white"
                    }`}
                    title="Klimboek"
                  >
                    <Icons.Book size={19} className="text-gray-500" />
                  </button>
                  <button
                    onClick={() => setView("activiteit")}
                    className={`p-2.5 rounded-xl transition-colors ${
                      view === "activiteit" ? "bg-white shadow-sm" : "hover:bg-white"
                    }`}
                    title="Activiteit"
                  >
                    <Icons.Activity size={19} className="text-gray-500" />
                  </button>
                  <button
                    onClick={() => setView("instellingen")}
                    className={`p-2.5 rounded-xl transition-colors ${
                      view === "instellingen" ? "bg-white shadow-sm" : "hover:bg-white"
                    }`}
                    title="Instellingen"
                  >
                    <Icons.Settings size={19} className="text-gray-500" />
                  </button>
                  <button
                    onClick={() => {
                      localStorage.removeItem(USER_KEY);
                      setUser("");
                    }}
                    className="ml-1 w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-sm hover:opacity-85 transition-opacity"
                    style={{ background: SAGE }}
                    title={`${user} — tik om te wisselen`}
                  >
                    {user.charAt(0)}
                  </button>
                </div>
              </div>

              {/* WAND VIEW */}
              {view === "wand" && (
                <React.Fragment>
                  {/* BERG */}
                  <div className="bg-white rounded-3xl shadow-md mb-4 relative overflow-hidden">
                    {showConfetti && <Confetti />}
                    {displayStreak > 0 && (
                      <div
                        className="absolute top-3 right-3 px-3 py-1.5 rounded-full text-xs font-bold text-white z-10"
                        style={{ background: TERRA }}
                      >
                        🔥 {displayStreak}{" "}
                        {displayStreak === 1 ? "week" : "weken"} op rij
                      </div>
                    )}
                    <MountainProgress progress={progress} summited={allDone} />
                    <div className="px-5 pb-4 -mt-1">
                      <div className="flex items-center justify-between">
                        <div className="text-sm font-bold" style={{ color: INK }}>
                          {allDone
                            ? "Getopt! Alle routes gesendt 🎉"
                            : `${completedCount} van ${totalTasks} routes gesendt`}
                        </div>
                        <div className="text-xs text-gray-400 flex items-center gap-1">
                          <Icons.Clock size={13} />
                          zo {sundayLabel} • {timeLeftLabel}
                        </div>
                      </div>
                      <div className="mt-2 bg-gray-100 rounded-full h-2">
                        <div
                          className="h-2 rounded-full transition-all duration-700"
                          style={{
                            width: `${progress * 100}%`,
                            background: SAGE,
                          }}
                        />
                      </div>
                    </div>
                  </div>

                  {/* VORIGE WEEK BANNER */}
                  {lastWeekEditable && lastUndoneCount > 0 && (
                    <button
                      onClick={() => setView("vorige")}
                      className="w-full bg-white border-l-4 rounded-2xl shadow-sm p-3 mb-4 flex items-center gap-3 hover:shadow-md transition-shadow text-left"
                      style={{ borderColor: TERRA }}
                    >
                      <span className="text-xl">⏰</span>
                      <div className="flex-1">
                        <div className="text-sm font-bold" style={{ color: INK }}>
                          Vorige week niet getopt
                        </div>
                        <div className="text-xs text-gray-500">
                          Nog {lastUndoneCount}{" "}
                          {lastUndoneCount === 1 ? "route" : "routes"} — tik om
                          in te halen
                        </div>
                      </div>
                      <Icons.ChevronRight size={18} className="text-gray-400" />
                    </button>
                  )}

                  {/* MAAND-BALANS — touwtrekken tussen de twee klimmers */}
                  {config.people.length === 2 &&
                    (() => {
                      const sameMonth = (at) => {
                        const d = new Date(at);
                        return (
                          d.getMonth() === now.getMonth() &&
                          d.getFullYear() === now.getFullYear()
                        );
                      };
                      const score = (p) =>
                        routeLog
                          .filter((l) => l.by === p && sameMonth(l.at))
                          .reduce(
                            (s, l) => s + (GRADE_WEIGHT[l.grade] || 2),
                            0
                          ) +
                        boulderLogs.filter(
                          (l) => l.by === p && sameMonth(l.at)
                        ).length;
                      const pA = config.people[0];
                      const pB = config.people[1];
                      const a = score(pA);
                      const b = score(pB);
                      const tot = a + b;
                      // knoop schuift naar wie het meest doet (A staat links)
                      const pos = tot ? b / tot : 0.5;
                      const balanced =
                        tot === 0 || (pos >= 0.42 && pos <= 0.58);
                      const leader = a >= b ? pA : pB;
                      const monthName = now.toLocaleDateString("nl-NL", {
                        month: "long",
                      });
                      return (
                        <div className="bg-white rounded-3xl shadow-md p-4 mb-4">
                          <div className="flex items-baseline justify-between mb-3 px-1 gap-2">
                            <h3
                              className="font-bold text-sm"
                              style={{ color: INK }}
                            >
                              ⚖️ Balans — {monthName}
                            </h3>
                            <span className="text-[10px] text-gray-400 font-semibold">
                              {tot === 0
                                ? "nog geen sends deze maand"
                                : balanced
                                ? "mooi in balans"
                                : `${leader} trekt aan het touw 💪`}
                            </span>
                          </div>
                          <div className="flex justify-between text-xs font-bold mb-1.5 px-1" style={{ color: INK }}>
                            <span>🧗 {pA} · {a}</span>
                            <span>{b} · {pB} 🧗</span>
                          </div>
                          <div className="relative h-3 rounded-full bg-[#EEF1E6]">
                            <div
                              className="absolute top-1/2 left-1/2 w-px h-5 -translate-y-1/2 bg-[#D8D2C6]"
                            />
                            <div
                              className="absolute top-1/2 w-6 h-6 rounded-full border-4 border-white shadow-md transition-all duration-700"
                              style={{
                                background: balanced ? SAGE : TERRA,
                                left: `calc(${pos * 100}% - 12px)`,
                                transform: "translateY(-50%)",
                              }}
                            />
                          </div>
                        </div>
                      );
                    })()}

                  {/* BOULDERS — snelle klusjes die vaker per week gebeuren */}
                  {boulders.length > 0 && (
                    <div className="bg-white rounded-3xl shadow-md p-4 mb-4">
                      <div className="flex items-baseline justify-between mb-2.5 px-1 gap-2">
                        <h3 className="font-bold text-sm" style={{ color: INK }}>
                          🪨 Boulders
                        </h3>
                        <span className="text-[10px] text-gray-400 font-semibold text-right">
                          vaker per week • telt niet mee voor de berg
                        </span>
                      </div>
                      <div className="space-y-2">
                        {boulders.map((b) => {
                          const weekLogs = boulderLogs.filter(
                            (l) =>
                              l.boulderId === b.id &&
                              l.absWeek === config.currentAbsWeek
                          );
                          const latest = boulderLogs.find(
                            (l) => l.boulderId === b.id
                          );
                          const canUndo =
                            latest &&
                            latest.by === user &&
                            Date.now() - latest.at < 5 * 60000;
                          return (
                            <div
                              key={b.id}
                              className="flex items-center gap-3 bg-[#FCFAF6] border border-[#EFE9DD] rounded-2xl p-3"
                            >
                              <span className="text-2xl flex-shrink-0">
                                {b.emoji}
                              </span>
                              <div className="flex-1 min-w-0">
                                <div
                                  className="font-bold text-sm truncate"
                                  style={{ color: INK }}
                                >
                                  {b.name}
                                </div>
                                <div className="text-xs text-gray-500">
                                  {weekLogs.length === 0
                                    ? "nog niet gedaan deze week"
                                    : (config.people || [])
                                        .map(
                                          (p) =>
                                            `${p} ${
                                              weekLogs.filter(
                                                (l) => l.by === p
                                              ).length
                                            }×`
                                        )
                                        .join(" • ")}
                                  {canUndo && (
                                    <button
                                      onClick={() =>
                                        undoBoulderLog(
                                          latest,
                                          `${b.emoji} ${b.name}`
                                        )
                                      }
                                      className="ml-2 font-bold underline text-gray-400 hover:text-gray-600"
                                    >
                                      ↩ oeps
                                    </button>
                                  )}
                                </div>
                              </div>
                              <button
                                onClick={() => setLoggingBoulder(b)}
                                className="w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center text-white hover:opacity-90 active:scale-90 transition-all"
                                style={{ background: SAGE }}
                                title={`${b.name} gedaan`}
                              >

                                    style={{ color: INK }}

                                >
                                  {mine.length}

                                  {mine.length === 1 ? "route" : "routes"}{" "}
                                  gesendt

                                <div className="space-y-1.5 text-xs text-gray-500">
                                  {GRADE_ORDER.map((g) => {

                                    return (

                                          className="w-2.5 h-2.5 rounded-full"

                                            background: GRADES[g].color,

                                  <div className="flex items-center gap-1.5">
                                    🪨 {myBldrs.length}{" "}
                                    {myBldrs.length === 1
                                      ? "boulder"
                                      : "boulders"}
                                  </div>
                                  {late > 0 && (
                                    <div className="flex items-center gap-1.5">
                                      ⏰ {late} te laat
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="bg-white rounded-2xl shadow-sm p-3.5 mt-3 text-center text-sm text-gray-500">
                          Samen:{" "}
                          <span className="font-bold" style={{ color: INK }}>
                            {routes.length}
                          </span>{" "}
                          routes en{" "}
                          <span className="font-bold" style={{ color: INK }}>
                            {bldrs.length}
                          </span>{" "}
                          boulders
                          {displayStreak > 0 && (
                            <span>
                              {" "}
                              • 🔥 {displayStreak}{" "}
                              {displayStreak === 1 ? "week" : "weken"} streak
                            </span>
                          )}
                        </div>
                      </React.Fragment>
                    );
                  })()}
                </React.Fragment>
              )}

              {/* LOGBOEK VIEW */}
              {view === "activiteit" && (
                <React.Fragment>
                  <div className="bg-white rounded-3xl shadow-md p-5 mb-4 flex items-center gap-3">
                    <button
                      onClick={() => setView("wand")}
                      className="p-2 hover:bg-gray-100 rounded-xl"
                    >
                      <Icons.ChevronLeft size={20} />
                    </button>
                    <div>
                      <h2 className="text-xl font-bold" style={{ color: INK }}>
                        Activiteit
                      </h2>
                      <p className="text-sm text-gray-500">Recente acties</p>
                    </div>

                  <div className="space-y-2">
                    {activity.length === 0 && (
                      <div className="bg-white rounded-2xl p-6 text-center text-gray-500">

                      </div>
                    )}
                    {activity.map((act, i) => {
                      const emoji = act.action.includes("top")
                        ? "🏔️"
                        : act.action.includes("stuurde")
                        ? "✅"
                        : act.action.includes("boulder") ||
                          act.action === "deed"
                        ? "🪨"
                        : act.action.includes("ongedaan") ||
                          act.action.includes("vinkje")
                        ? "↩️"
                        : act.action.includes("in") && act.action.includes("laat")
                        ? "⏰"
                        : act.action.includes("route")
                        ? "🧗"
                        : act.action.includes("week")
                        ? "📅"
                        : "📝";
                      return (
                        <div
                          key={i}
                          className="bg-white rounded-2xl shadow-sm p-3.5 flex items-start gap-3"
                        >
                          <span className="text-lg">{emoji}</span>
                          <div className="flex-1">
                            <div className="text-sm" style={{ color: INK }}>
                              <span className="font-bold">{act.user}</span>{" "}
                              <span className="text-gray-500">{act.action}</span>{" "}
                              <span className="font-semibold">{act.detail}</span>

                              {formatTimestamp(act.at)}

                          </div>

                </React.Fragment>

              {/* INSTELLINGEN VIEW */}
              {view === "instellingen" && (
                <SettingsView
                  config={config}
                  streak={streak}

                  user={user}
                  currentTasks={currentTasks}
                  lastTasks={lastTasks}
                  boulderLogs={boulderLogs}

                  onBack={() => setView("wand")}

              {/* BOULDER BEVESTIGING */}
              <ConfirmDialog
                isOpen={!!loggingBoulder}
                title={
                  loggingBoulder
                    ? `${loggingBoulder.emoji} ${loggingBoulder.name}?`

                }
                message="Mooi bezig — we zetten 'm in je klimboek."

                confirmText="Ja, gedaan!"

      // ============================================================================
      // INSTELLINGEN
      // ============================================================================

      function SettingsView({
        config,
        streak,
        displayStreak,
        user,
        currentTasks,
        lastTasks,
        boulderLogs,
        getAssignee,
        logActivity,
        onBack,
      }) {
        const [newTask, setNewTask] = useState("");
        const [newGrade, setNewGrade] = useState("blauw");
        const [newBoulder, setNewBoulder] = useState("");
        const [newBoulderEmoji, setNewBoulderEmoji] = useState("🪨");
        const [newPerson, setNewPerson] = useState("");
        const [showAddPerson, setShowAddPerson] = useState(false);
        const [expanded, setExpanded] = useState({});
        const [deleteTaskId, setDeleteTaskId] = useState(null);
        const [deleteBoulderId, setDeleteBoulderId] = useState(null);
        const [showStreakReset, setShowStreakReset] = useState(false);

        const tasks = config.tasks || [];
        const people = config.people || [];
        const boulders = config.boulders || [];

        const updateConfig = async (updates) => {
          await dbRef("config").update(updates);
        };

        const updateTask = async (taskId, updates) => {
          const newTasks = tasks.map((t) =>
            t.id === taskId ? { ...t, ...updates } : t
          );
          await updateConfig({ tasks: newTasks });
        };

        const addTask = async () => {
          const name = newTask.trim();
          if (!name) return;
          const id = `${slugify(name)}_${Date.now().toString(36)}`;
          await updateConfig({
            tasks: [
              ...tasks,
              {
                id,
                name,
                grade: newGrade,
                mode: "beurt",
                offset: tasks.length % Math.max(people.length, 1),
              },
            ],
          });
          await logActivity(user, "voegde een route toe:", name);
          setNewTask("");
          setNewGrade("blauw");
        };

        const confirmRemoveTask = async () => {
          const task = tasks.find((t) => t.id === deleteTaskId);
          if (!task) {
            setDeleteTaskId(null);
            return;
          }
          await updateConfig({
            tasks: tasks.filter((t) => t.id !== deleteTaskId),
          });
          if (currentTasks[deleteTaskId]) {
            const cleaned = { ...currentTasks };
            delete cleaned[deleteTaskId];
            await dbRef("currentWeekTasks").set(cleaned);
          }
          if (lastTasks[deleteTaskId]) {
            const cleaned = { ...lastTasks };
            delete cleaned[deleteTaskId];
            await dbRef("lastWeekTasks").set(cleaned);
          }
          await logActivity(user, "verwijderde een route:", task.name);
          setDeleteTaskId(null);
        };

        const addBoulder = async () => {
          const name = newBoulder.trim();
          if (!name) return;
          const id = `${slugify(name)}_${Date.now().toString(36)}`;
          await updateConfig({
            boulders: [
              ...boulders,
              { id, name, emoji: newBoulderEmoji.trim() || "🪨" },
            ],
          });
          await logActivity(user, "voegde een boulder toe:", name);
          setNewBoulder("");
          setNewBoulderEmoji("🪨");
        };

        const confirmRemoveBoulder = async () => {
          const b = boulders.find((x) => x.id === deleteBoulderId);
          if (!b) {
            setDeleteBoulderId(null);
            return;
          }
          await updateConfig({
            boulders: boulders.filter((x) => x.id !== deleteBoulderId),
          });
          await dbRef("boulderLogs").set(
            (boulderLogs || []).filter((l) => l.boulderId !== deleteBoulderId)
          );
          await logActivity(user, "verwijderde een boulder:", b.name);
          setDeleteBoulderId(null);
        };

        const addPerson = async () => {
          const name = newPerson.trim();
          if (!name || people.includes(name)) return;
          await updateConfig({ people: [...people, name] });
          setNewPerson("");
          setShowAddPerson(false);
        };

        const removePerson = async (person) => {
          const newTasks = tasks.map((t) =>
            t.owner === person
              ? { ...t, owner: null, mode: "beurt" }
              : t
          );
          await updateConfig({
            people: people.filter((p) => p !== person),
            tasks: newTasks,
          });
        };

        const resetStreak = async () => {
          await dbRef("streak").set({ count: 0, lastSummitAbsWeek: null });
          await logActivity(user, "reset de streak", "");
          setShowStreakReset(false);
        };

        const taskToDelete = tasks.find((t) => t.id === deleteTaskId);
        const boulderToDelete = boulders.find((b) => b.id === deleteBoulderId);

        return (
          <React.Fragment>
            <div className="bg-white rounded-3xl shadow-md p-5 mb-4 flex items-center gap-3">
              <button
                onClick={onBack}
                className="p-2 hover:bg-gray-100 rounded-xl"
              >
                <Icons.ChevronLeft size={20} />
              </button>
              <div>
                <h2 className="text-xl font-bold" style={{ color: INK }}>
                  Instellingen
                </h2>
                <p className="text-sm text-gray-500">Routes & klimmers</p>
              </div>
            </div>

            {/* ROUTES */}
            <div className="bg-white rounded-3xl shadow-md p-5 mb-4">
              <h3 className="font-bold mb-3" style={{ color: INK }}>
                🧗 Routes
              </h3>
              <div className="space-y-2.5">
                {tasks.map((task) => {
                  const grade = GRADES[task.grade] || GRADES.blauw;
                  const isOpen = !!expanded[task.id];
                  const assignee = getAssignee(task, config.currentAbsWeek);
                  const nextAssignee = getAssignee(
                    task,
                    config.currentAbsWeek + 1
                  );
                  return (
                    <div
                      key={task.id}
                      className="border-2 border-[#EFE9DD] rounded-2xl overflow-hidden"
                    >
                      <div
                        onClick={() =>
                          setExpanded({ ...expanded, [task.id]: !isOpen })
                        }
                        className="flex items-center justify-between p-3.5 cursor-pointer hover:bg-gray-50"
                      >
                        <div className="flex items-center gap-2.5">
                          {isOpen ? (
                            <Icons.ChevronDown size={17} className="text-gray-400" />
                          ) : (
                            <Icons.ChevronRight size={17} className="text-gray-400" />
                          )}
                          <span
                            className="w-3 h-3 rounded-full"
                            style={{ background: grade.color }}
                          />
                          <span className="font-bold" style={{ color: INK }}>
                            {task.name}
                          </span>
                        </div>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            setDeleteTaskId(task.id);
                          }}
                          className="p-2 hover:bg-red-50 rounded-lg text-red-400 hover:text-red-600"
                        >
                          <Icons.X size={16} />
                        </button>
                      </div>
                      {isOpen && (
                        <div className="p-4 border-t border-[#EFE9DD] bg-[#FCFAF6] space-y-4">
                          {/* GRADE */}
                          <div>
                            <p className="text-xs font-bold text-gray-500 mb-2">
                              ZWAARTE
                            </p>
                            <div className="flex flex-wrap gap-2">
                              {GRADE_ORDER.map((g) => (
                                <button
                                  key={g}
                                  onClick={() => updateTask(task.id, { grade: g })}
                                  className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${
                                    task.grade === g
                                      ? "text-white shadow"
                                      : "bg-gray-100 text-gray-500 hover:bg-gray-200"
                                  }`}
                                  style={
                                    task.grade === g
                                      ? { background: GRADES[g].color }
                                      : {}
                                  }
                                >
                                  {GRADES[g].label}
                                </button>
                              ))}
                            </div>
                          </div>
                          {/* WIE */}
                          <div>
                            <p className="text-xs font-bold text-gray-500 mb-2">
                              WIE KLIMT 'M?
                            </p>
                            <div className="flex gap-2 mb-3">
                              <button
                                onClick={() =>
                                  updateTask(task.id, { mode: "beurt" })
                                }
                                className={`flex-1 px-3 py-2 rounded-xl text-sm font-bold border-2 transition-all ${
                                  task.mode !== "vast"
                                    ? "border-[#8A9B6E] bg-[#EEF1E6]"
                                    : "border-gray-200 text-gray-500"
                                }`}
                                style={task.mode !== "vast" ? { color: INK } : {}}
                              >
                                Om de beurt
                              </button>
                              <button
                                onClick={() =>
                                  updateTask(task.id, {
                                    mode: "vast",
                                    owner: task.owner || people[0] || null,
                                  })
                                }
                                className={`flex-1 px-3 py-2 rounded-xl text-sm font-bold border-2 transition-all ${
                                  task.mode === "vast"
                                    ? "border-[#8A9B6E] bg-[#EEF1E6]"
                                    : "border-gray-200 text-gray-500"
                                }`}
                                style={task.mode === "vast" ? { color: INK } : {}}
                              >
                                Vaste klimmer
                              </button>
                            </div>
                            {task.mode === "vast" ? (
                              <div className="flex flex-wrap gap-2">
                                {people.map((person) => (
                                  <button
                                    key={person}
                                    onClick={() =>
                                      updateTask(task.id, { owner: person })
                                    }
                                    className={`px-3.5 py-1.5 rounded-full text-sm font-bold transition-all ${
                                      task.owner === person
                                        ? "text-white"
                                        : "bg-gray-100 text-gray-500 hover:bg-gray-200"
                                    }`}
                                    style={
                                      task.owner === person
                                        ? { background: SAGE }
                                        : {}
                                    }
                                  >
                                    {person}
                                  </button>
                                ))}
                              </div>
                            ) : (
                              <div className="flex items-center justify-between bg-white rounded-xl border border-[#EFE9DD] p-3">
                                <div className="text-sm">
                                  <span className="font-bold" style={{ color: INK }}>
                                    {assignee || "?"}
                                  </span>
                                  <span className="text-gray-400">
                                    {" "}
                                    nu • daarna {nextAssignee || "?"}
                                  </span>
                                </div>
                                <button
                                  onClick={() =>
                                    updateTask(task.id, {
                                      offset:
                                        ((task.offset || 0) + 1) %
                                        Math.max(people.length, 1),
                                    })
                                  }
                                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold text-white hover:opacity-90"
                                  style={{ background: TERRA }}
                                >
                                  <Icons.Swap size={13} />
                                  Wissel beurt
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* NIEUWE ROUTE */}
                <div className="border-2 border-dashed border-[#D8D2C6] rounded-2xl p-4">
                  <input
                    type="text"
                    value={newTask}
                    onChange={(e) => setNewTask(e.target.value)}
                    onKeyPress={(e) => e.key === "Enter" && addTask()}
                    placeholder="Nieuwe route (bijv. Ramen lappen)"
                    className="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mb-3 outline-none focus:border-[#8A9B6E]"
                  />
                  <div className="flex items-center justify-between gap-2 flex-wrap">
                    <div className="flex gap-1.5">
                      {GRADE_ORDER.map((g) => (
                        <button
                          key={g}
                          onClick={() => setNewGrade(g)}
                          className={`w-7 h-7 rounded-full transition-all ${
                            newGrade === g
                              ? "ring-2 ring-offset-2 ring-gray-400 scale-110"
                              : "opacity-50 hover:opacity-100"
                          }`}
                          style={{ background: GRADES[g].color }}
                          title={`${GRADES[g].label} — ${GRADES[g].sub}`}
                        />
                      ))}
                    </div>
                    <button
                      onClick={addTask}
                      disabled={!newTask.trim()}
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-xl font-bold text-white text-sm transition-all ${
                        newTask.trim()
                          ? "hover:opacity-90"
                          : "opacity-40 cursor-not-allowed"
                      }`}
                      style={{ background: SAGE }}
                    >
                      <Icons.Plus size={15} />
                      Toevoegen
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* BOULDERS */}
            <div className="bg-white rounded-3xl shadow-md p-5 mb-4">
              <h3 className="font-bold mb-1" style={{ color: INK }}>
                🪨 Boulders
              </h3>
              <p className="text-xs text-gray-400 mb-3">
                Snelle klusjes die vaker per week gebeuren — tikken om te
                loggen, los van de weekroutes.
              </p>
              <div className="space-y-2">
                {boulders.map((b) => (
                  <div
                    key={b.id}
                    className="flex items-center justify-between border-2 border-[#EFE9DD] rounded-2xl p-3"
                  >
                    <div className="flex items-center gap-2.5">
                      <span className="text-xl">{b.emoji}</span>
                      <span className="font-bold" style={{ color: INK }}>
                        {b.name}
                      </span>
                    </div>
                    <button
                      onClick={() => setDeleteBoulderId(b.id)}
                      className="p-2 hover:bg-red-50 rounded-lg text-red-400 hover:text-red-600"
                    >
                      <Icons.X size={16} />
                    </button>
                  </div>
                ))}
                <div className="border-2 border-dashed border-[#D8D2C6] rounded-2xl p-4">
                  <div className="flex gap-2 mb-3">
                    <input
                      type="text"
                      value={newBoulderEmoji}
                      onChange={(e) => setNewBoulderEmoji(e.target.value)}
                      maxLength={4}
                      className="w-14 px-2 py-2.5 border-2 border-gray-200 rounded-xl text-center outline-none focus:border-[#8A9B6E]"
                      title="Emoji"
                    />
                    <input
                      type="text"
                      value={newBoulder}
                      onChange={(e) => setNewBoulder(e.target.value)}
                      onKeyPress={(e) => e.key === "Enter" && addBoulder()}
                      placeholder="Nieuwe boulder (bijv. Afwas)"
                      className="flex-1 min-w-0 px-3 py-2.5 border-2 border-gray-200 rounded-xl outline-none focus:border-[#8A9B6E]"
                    />
                  </div>
                  <div className="flex justify-end">
                    <button
                      onClick={addBoulder}
                      disabled={!newBoulder.trim()}
                      className={`flex items-center gap-1.5 px-4 py-2 rounded-xl font-bold text-white text-sm transition-all ${
                        newBoulder.trim()
                          ? "hover:opacity-90"
                          : "opacity-40 cursor-not-allowed"
                      }`}
                      style={{ background: SAGE }}
                    >
                      <Icons.Plus size={15} />
                      Toevoegen
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* KLIMMERS */}
            <div className="bg-white rounded-3xl shadow-md p-5 mb-4">
              <h3 className="font-bold mb-3" style={{ color: INK }}>
                ⛺ Klimmers
              </h3>
              <div className="flex flex-wrap gap-2">
                {people.map((person) => (
                  <div
                    key={person}
                    className="inline-flex items-center gap-2 bg-[#EEF1E6] px-4 py-2 rounded-full font-bold text-sm"
                    style={{ color: INK }}
                  >
                    <span>{person}</span>
                    {people.length > 1 && (
                      <button
                        onClick={() => removePerson(person)}
                        className="hover:bg-[#DDE4CC] rounded-full p-0.5"
                      >
                        <Icons.X size={14} />
                      </button>
                    )}
                  </div>
                ))}
                {showAddPerson ? (
                  <div className="inline-flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full">
                    <input
                      type="text"
                      value={newPerson}
                      onChange={(e) => setNewPerson(e.target.value)}
                      onKeyPress={(e) => e.key === "Enter" && addPerson()}
                      placeholder="Naam..."
                      className="bg-transparent border-none outline-none w-24 text-sm"
                      autoFocus
                    />
                    <button
                      onClick={addPerson}
                      className="hover:bg-gray-200 rounded-full p-1"
                    >
                      <Icons.Check size={14} />
                    </button>
                    <button
                      onClick={() => setShowAddPerson(false)}
                      className="hover:bg-gray-200 rounded-full p-1"
                    >
                      <Icons.X size={14} />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowAddPerson(true)}
                    className="inline-flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-500 px-3.5 py-2 rounded-full"
                  >
                    <Icons.Plus size={15} />
                  </button>
                )}
              </div>
              <p className="text-xs text-gray-400 mt-3">
                Bij "om de beurt" wisselen routes wekelijks tussen de klimmers.
              </p>
            </div>

            {/* STREAK */}
            <div className="bg-white rounded-3xl shadow-md p-5 mb-4">
              <h3 className="font-bold mb-1" style={{ color: INK }}>
                🔥 Streak
              </h3>
              <p className="text-sm text-gray-500 mb-3">
                Jullie staan op{" "}
                <span className="font-bold" style={{ color: INK }}>
                  {displayStreak} {displayStreak === 1 ? "week" : "weken"}
                </span>{" "}
                op rij alles gesendt.
              </p>
              <button
                onClick={() => setShowStreakReset(true)}
                className="text-sm font-bold text-red-400 hover:text-red-600"
              >
                Streak resetten
              </button>
            </div>

            <p className="text-center text-xs text-gray-400 mt-6">
              Basecamp ⛺ {people.join(" & ")}
            </p>

            <ConfirmDialog
              isOpen={!!deleteTaskId}
              title="Route verwijderen?"
              message={
                taskToDelete
                  ? `"${taskToDelete.name}" wordt van de wand gehaald.`
                  : ""
              }
              onConfirm={confirmRemoveTask}
              onCancel={() => setDeleteTaskId(null)}
              confirmText="Verwijder"
            />
            <ConfirmDialog
              isOpen={!!deleteBoulderId}
              title="Boulder verwijderen?"
              message={
                boulderToDelete
                  ? `"${boulderToDelete.name}" en de bijbehorende logjes worden verwijderd.`
                  : ""
              }
              onConfirm={confirmRemoveBoulder}
              onCancel={() => setDeleteBoulderId(null)}
              confirmText="Verwijder"
            />
            <ConfirmDialog
              isOpen={showStreakReset}
              title="Streak resetten?"
              message="De teller gaat terug naar 0. Dit kan niet ongedaan worden gemaakt."
              onConfirm={resetStreak}
              onCancel={() => setShowStreakReset(false)}
              confirmText="Ja, reset"
            />
          </React.Fragment>
        );
      }

      // ============================================================================
      // INIT
      // ============================================================================

      ReactDOM.createRoot(document.getElementById("root")).render(<App />); // Basecamp v1.1 — boulders
    </script>
  </body>
</html>
